<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="300"
     viewBox="0 0 1200 300">

  <defs>

    <linearGradient
        id="accent"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%">

      <stop
          offset="0%"
          stop-color="#A855F7"/>

      <stop
          offset="50%"
          stop-color="#22D3EE"/>

      <stop
          offset="100%"
          stop-color="#38BDF8"/>

    </linearGradient>


    <filter
        id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%">

      <feGaussianBlur
          stdDeviation="4"
          result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- ================================================ -->
  <!-- BACKGROUND -->
  <!-- ================================================ -->

  <rect
      x="0"
      y="0"
      width="1200"
      height="300"
      rx="28"
      fill="#090D14"/>


  <rect
      x="2"
      y="2"
      width="1196"
      height="296"
      rx="26"
      fill="none"
      stroke="#273244"
      stroke-width="2"/>


  <!-- ================================================ -->
  <!-- ANIMATED CIRCUIT WAVE -->
  <!-- ================================================ -->

  <path
      d="M35 55
         C180 20 290 85 430 54
         S700 25 835 58
         S1050 78 1165 40"

      fill="none"
      stroke="#273244"
      stroke-width="5"/>


  <path
      d="M35 55
         C180 20 290 85 430 54
         S700 25 835 58
         S1050 78 1165 40"

      fill="none"
      stroke="url(#accent)"
      stroke-width="2"
      stroke-dasharray="9 15"
      filter="url(#glow)">

    <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="-220"
        dur="2s"
        repeatCount="indefinite"/>

  </path>


  <!-- ================================================ -->
  <!-- MAIN MESSAGE -->
  <!-- ================================================ -->

  <text
      x="600"
      y="112"
      text-anchor="middle"
      fill="#E2E8F0"
      font-family="Arial, sans-serif"
      font-size="28"
      font-weight="700">

    SYSTEM SHUTDOWN: NOT FOUND

  </text>


  <text
      x="600"
      y="143"
      text-anchor="middle"
      fill="#22D3EE"
      font-family="monospace"
      font-size="13">

    KEEP BUILDING. KEEP LEARNING. KEEP SHIPPING.

  </text>


  <!-- ================================================ -->
  <!-- TECH STACK -->
  <!-- ================================================ -->

  <rect
      x="260"
      y="170"
      width="680"
      height="55"
      rx="14"
      fill="#0B111B"
      stroke="#263449"/>


  <text
      x="600"
      y="194"
      text-anchor="middle"
      fill="#64748B"
      font-family="monospace"
      font-size="10">

    TECH STACK

  </text>


  <text
      x="600"
      y="213"
      text-anchor="middle"
      fill="#F1F5F9"
      font-family="monospace"
      font-size="12">

    JAVA / SPRING BOOT / REACT / SQL / DOCKER / CLOUD

  </text>


  <!-- ================================================ -->
  <!-- SIGNATURE -->
  <!-- ================================================ -->

  <text
      x="600"
      y="260"
      text-anchor="middle"
      fill="#64748B"
      font-family="monospace"
      font-size="10">

    VAIBHAO.KAMBLE // SOFTWARE ENGINEERING

  </text>

</svg>
