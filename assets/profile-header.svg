<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="430"
     viewBox="0 0 1200 430">

  <defs>

    <!-- Main background -->
    <linearGradient id="bg"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#07151B"/>
    </linearGradient>

    <!-- Neon accent -->
    <linearGradient id="accent"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
          stdDeviation="4"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
      x="0"
      y="0"
      width="1200"
      height="430"
      rx="28"
      fill="url(#bg)"/>

  <rect
      x="2"
      y="2"
      width="1196"
      height="426"
      rx="26"
      fill="none"
      stroke="#263244"
      stroke-width="2"/>


  <!-- ================================================= -->
  <!-- TERMINAL BAR -->
  <!-- ================================================= -->

  <rect
      x="28"
      y="26"
      width="1144"
      height="46"
      rx="12"
      fill="#111925"
      stroke="#263244"/>


  <!-- Window buttons -->

  <circle
      cx="52"
      cy="49"
      r="6"
      fill="#F43F5E"/>

  <circle
      cx="72"
      cy="49"
      r="6"
      fill="#F59E0B"/>

  <circle
      cx="92"
      cy="49"
      r="6"
      fill="#22C55E"/>


  <!-- Terminal title -->

  <text
      x="118"
      y="54"
      fill="#64748B"
      font-family="monospace"
      font-size="13">

    VAIBHAO.DEV / ENGINEERING-CONSOLE

  </text>


  <!-- Online status -->

  <text
      x="1146"
      y="54"
      text-anchor="end"
      fill="#22C55E"
      font-family="monospace"
      font-size="12">

    SYSTEM ONLINE

  </text>


  <!-- ================================================= -->
  <!-- MAIN TITLE -->
  <!-- ================================================= -->

  <text
      x="600"
      y="118"
      text-anchor="middle"
      fill="#F1F5F9"
      font-family="Arial, sans-serif"
      font-size="38"
      font-weight="700">

    VAIBHAO // SYSTEM ONLINE

  </text>


  <text
