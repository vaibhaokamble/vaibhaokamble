  <!-- ================================================= -->
  <!-- ANIMATED CIRCUIT -->
  <!-- ================================================= -->

  <line
      x1="80"
      y1="390"
      x2="1120"
      y2="390"
      stroke="#263449"
      stroke-width="3"/>


  <line
      x1="80"
      y1="390"
      x2="1120"
      y2="390"
      stroke="url(#accent)"
      stroke-width="2"
      stroke-dasharray="10 16"
