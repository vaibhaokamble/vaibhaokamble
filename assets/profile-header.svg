      y="148"
      text-anchor="middle"
      fill="#22D3EE"
      font-family="monospace"
      font-size="15">

    JAVA FULL-STACK DEVELOPER  /  SOFTWARE ENGINEER

  </text>


  <!-- ================================================= -->
  <!-- COMMAND -->
  <!-- ================================================= -->

  <text
      x="56"
      y="190"
      fill="#22C55E"
      font-family="monospace"
      font-size="13">

    $

  </text>

  <text
      x="76"
      y="190"
      fill="#CBD5E1"
      font-family="monospace"
      font-size="13">

    ./developer --initialize --production

  </text>

  <text
      x="390"
