<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="260"
  viewBox="0 0 1000 260">

  <defs>

    <!-- Main animated gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate
          attributeName="stop-color"
          values="#58A6FF;#22D3EE;#A78BFA;#58A6FF"
          dur="5s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#22D3EE">
        <animate
          attributeName="stop-color"
          values="#22D3EE;#A78BFA;#58A6FF;#22D3EE"
          dur="5s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#A78BFA">
        <animate
          attributeName="stop-color"
          values="#A78BFA;#58A6FF;#22D3EE;#A78BFA"
          dur="5s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Soft background gradient -->
    <linearGradient
      id="background"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%">

      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>

    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="0"
    width="1000"
    height="260"
    rx="24"
    fill="url(#background)"
    stroke="#30363D"
    stroke-width="2"/>


  <!-- ================================================= -->
  <!-- MOVING TOP LIGHT                                  -->
  <!-- ================================================= -->

  <rect
    x="-250"
    y="0"
    width="250"
    height="3"
    fill="url(#nameGradient)"
    filter="url(#glow)">

    <animate
      attributeName="x"
      values="-250;1000;-250"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- STATUS                                            -->
  <!-- ================================================= -->

  <circle
    cx="70"
    cy="48"
    r="6"
    fill="#22C55E"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="1.5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="r"
      values="6;8;6"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="86"
    y="53"
    fill="#94A3B8"
    font-family="monospace"
    font-size="13"
    letter-spacing="2">

    AVAILABLE TO BUILD

  </text>


  <!-- ================================================= -->
  <!-- HELLO                                             -->
  <!-- ================================================= -->

  <text
    x="500"
    y="92"
    text-anchor="middle"
    fill="#94A3B8"
    font-family="Arial, sans-serif"
    font-size="18"
    font-weight="600">

    Hello, I'm

  </text>


  <!-- ================================================= -->
  <!-- NAME                                              -->
  <!-- ================================================= -->

  <text
    x="500"
    y="145"
    text-anchor="middle"
    fill="url(#nameGradient)"
    font-family="Arial, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="3"
    filter="url(#glow)">

    VAIBHAO KAMBLE

  </text>


  <!-- ================================================= -->
  <!-- UNDERLINE                                         -->
  <!-- ================================================= -->

  <rect
    x="330"
    y="162"
    width="340"
    height="2"
    rx="2"
    fill="url(#nameGradient)">

    <animate
      attributeName="width"
      values="120;340;120"
      dur="3s"
      repeatCount="indefinite"/>

    <animate
      attributeName="x"
      values="440;330;440"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- ROLE                                              -->
  <!-- ================================================= -->

  <text
    x="500"
    y="200"
    text-anchor="middle"
    fill="#F0F6FC"
    font-family="monospace"
    font-size="17"
    font-weight="600">

    JAVA FULL-STACK DEVELOPER

  </text>


  <!-- ================================================= -->
  <!-- TYPING CURSOR                                    -->
  <!-- ================================================= -->

  <rect
    x="690"
    y="184"
    width="3"
    height="20"
    rx="1"
    fill="#22D3EE">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- SKILLS                                            -->
  <!-- ================================================= -->

  <text
    x="500"
    y="230"
    text-anchor="middle"
    fill="#64748B"
    font-family="monospace"
    font-size="11"
    letter-spacing="1">

    JAVA  •  SPRING BOOT  •  REACT  •  REST API  •  SQL

  </text>


  <!-- ================================================= -->
  <!-- ANIMATED DOTS                                    -->
  <!-- ================================================= -->

  <circle
    cx="410"
    cy="230"
    r="2"
    fill="#58A6FF">

    <animate
      attributeName="cy"
      values="230;224;230"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>

  <circle
    cx="590"
    cy="230"
    r="2"
    fill="#A78BFA">

    <animate
      attributeName="cy"
      values="230;224;230"
      dur="1.4s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- BOTTOM WAVE                                      -->
  <!-- ================================================= -->

  <path
    d="M0 250 Q125 235 250 250 T500 250 T750 250 T1000 250"
    fill="none"
    stroke="url(#nameGradient)"
    stroke-width="2"
    opacity="0.8">

    <animate
      attributeName="d"
      values="
      M0 250 Q125 235 250 250 T500 250 T750 250 T1000 250;
      M0 250 Q125 265 250 250 T500 250 T750 250 T1000 250;
      M0 250 Q125 235 250 250 T500 250 T750 250 T1000 250"
      dur="4s"
      repeatCount="indefinite"/>

  </path>


</svg>
