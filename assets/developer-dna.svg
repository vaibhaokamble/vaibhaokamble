<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#020617"/>
<stop offset="100%" stop-color="#164E63"/>
</linearGradient>

<style>

.t{
font-family:'Courier New',monospace;
fill:#E2E8F0;
font-weight:600;
}

.node{
fill:#0F172A;
stroke:#22D3EE;
stroke-width:2;
}

.txt{
font-size:20px;
}

.arr{
stroke:#22D3EE;
stroke-width:3;
stroke-dasharray:10 10;
animation:flow 1.4s linear infinite;
}

.n1{animation:pulse 7s infinite 0s;}
.n2{animation:pulse 7s infinite .8s;}
.n3{animation:pulse 7s infinite 1.6s;}
.n4{animation:pulse 7s infinite 2.4s;}
.n5{animation:pulse 7s infinite 3.2s;}
.n6{animation:pulse 7s infinite 4s;}

@keyframes flow{
to{
stroke-dashoffset:-20;
}
}

@keyframes pulse{
0%,10%{
opacity:.35;
transform:scale(.97);
}

20%,70%{
opacity:1;
transform:scale(1);
}

82%,100%{
opacity:.35;
transform:scale(.97);
}
}

</style>

</defs>

<rect
x="10"
y="10"
width="880"
height="600"
rx="28"
fill="url(#bg)"
stroke="#22D3EE"
stroke-opacity=".4"
/>

<text
x="450"
y="62"
text-anchor="middle"
class="t"
font-size="30"
>
🧬 DEVELOPER DNA
</text>

<g transform="translate(300 95)">
<rect
class="node n1"
width="300"
height="58"
rx="18"
/>

<text
x="150"
y="38"
text-anchor="middle"
class="t txt"
>
💡 PROBLEM
</text>
</g>

<line class="arr" x1="450" y1="153" x2="450" y2="185"/>

<g transform="translate(300 185)">
<rect
class="node n2"
width="300"
height="58"
rx="18"
/>

<text
x="150"
y="38"
text-anchor="middle"
class="t txt"
>
🔍 UNDERSTAND
</text>
</g>

<line class="arr" x1="450" y1="243" x2="450" y2="275"/>

<g transform="translate(300 275)">
<rect
class="node n3"
width="300"
height="58"
rx="18"
/>

<text
x="150"
y="38"
text-anchor="middle"
class="t txt"
>
🏗️ ARCHITECT
</text>
</g>

<line class="arr" x1="450" y1="333" x2="450" y2="365"/>

<g transform="translate(300 365)">
<rect
class="node n4"
width="300"
height="58"
rx="18"
/>

<text
x="150"
y="38"
text-anchor="middle"
class="t txt"
>
💻 BUILD
</text>
</g>

<line class="arr" x1="450" y1="423" x2="450" y2="455"/>

<g transform="translate(300 455)">
<rect
class="node n5"
width="300"
height="58"
rx="18"
/>

<text
x="150"
y="38"
text-anchor="middle"
class="t txt"
>
🔐 SECURE • 🧪 TEST
</text>
</g>

<line class="arr" x1="450" y1="513" x2="450" y2="545"/>

<g transform="translate(300 545)">
<rect
class="node n6"
width="300"
height="58"
rx="18"
/>

<text
x="150"
y="38"
text-anchor="middle"
class="t txt"
>
🚀 DEPLOY • 🔄 IMPROVE
</text>
</g>

</svg>
